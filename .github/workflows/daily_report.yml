name: Daily Governor Report

on:
  schedule:
  - cron: '*/5 * * * *'  # каждые 5 минут
  workflow_dispatch:  # Для ручного запуска

jobs:
  send-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Wait for correct time (ensure 10:15 MSK)
        run: |
          echo "Current UTC time: $(date -u '+%H:%M')"
          echo "Current MSK time: $(date -u '+%H:%M' | awk '{print ($1+3)%24":00"}')"
      
      - name: Run daily report
        env:
          TOKEN: ${{ secrets.TOKEN }}
          API_KEY: ${{ secrets.API_KEY }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          echo "Starting daily report..."
          python bot.py daily
      
      - name: Send notification on success
        if: success()
        run: |
          echo "✅ Daily report completed successfully!"
