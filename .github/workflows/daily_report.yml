name: Daily Governor Report

on:
  schedule:
    # Запуск в 10:15 MSK = 07:15 UTC (MSK = UTC+3)
    - cron: '15 7 * * *'
  workflow_dispatch:  # Для ручного запуска через кнопку в GitHub

jobs:
  send-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run daily report
        env:
          TOKEN: ${{ secrets.TOKEN }}
          API_KEY: ${{ secrets.API_KEY }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}  # опционально
        run: |
          python bot.py daily
